<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Flight game</title>
  <link rel="stylesheet" href="css/game.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.7.1/leaflet.css">
</head>

<body>
  <div id="player-modal">
    <form id="player-form">
      <input type="text" placeholder="Player name" required>
      <input type="submit" value="Start game">
    </form>
  </div>

  <header>
    <h1>FLIGHT GAME</h1>
  </header>

<div class="button-top-right">
  <button>BUTTON</button>
</div>

  <main>

      <section id="map" class="card">
   <!--   <strong>PELIKARTTA (MAP) </strong> -->
    </section>

    <aside class="sidebar">
      <section id="panel_1" class="panel">
        <h2>PELIN STATUS:</h2>
        <p>TIME: [...]</p>
        <p>MOVES LEFT: [...]</p>
        <p>DISTANCE TRAVELLED: [...]</p>
      </section>

      <section id="panel_2" class="panel">
        <h2>INFO & HINTS</h2>
        <p>COUNTRY LIST:</p>
      </section>
    </aside>

  </main>

    <section class="input_box">
    <input type="text" id="input_field" placeholder="Travel to: " />
    <button id="input_button">MOVE!</button>
  </section>

  <footer>
  </footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.7.1/leaflet.js"></script>
<script src="JS/map.js"></script>
<script src="JS/EU_maat.js"></script>
</body>
</html>
