<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Flight game</title>
  <link rel="stylesheet" href="game.css">
</head>

<body>

  <header>
    <h1>FLIGHT GAME</h1>
  </header>

<div class="button-top-right">
  <button>BUTTON</button>
</div>

  <main>

  <!--  <section id="map" class="card"> -->
      <section id="map" class="card">
   <!--   <strong>PELIKARTTA (MAP) </strong> -->
    </section>

    <aside class="sidebar">
      <section id="panel_1" class="panel">
        <h2>PELIN STATUS:</h2>
        <p>TIME: [...]</p>
        <p>MOVES LEFT: [...]</p>
        <p>DISTANCE TRAVELLED: [...]</p>
      </section>

      <section id="panel_2" class="panel">
        <h2>INFO & HINTS</h2>
        <p>(Maiden liput)</p>
      </section>
    </aside>

  </main>

    <section class="input_box">
    <input type="text" id="input_field" placeholder="Travel to: " />
    <button id="input_button">MOVE!</button>
  </section>

  <footer>
  </footer>

  <script>
    document.getElementById('year').textContent = new Date().getFullYear();
  </script>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.7.1/leaflet.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.7.1/leaflet.js"></script>

<script>
const options = { enableHighAccuracy: true, timeout: 5000, maximumAge: 0 };

let map, marker;

// MAP "alustus"
function success(pos) {
  const crd = pos.coords;
  map = L.map('map').setView([crd.latitude, crd.longitude], 5);

  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; OpenStreetMap contributors'
  }).addTo(map);

  marker = L.marker([crd.latitude, crd.longitude]).addTo(map)
           .bindPopup("I am here.")
           .openPopup();
}

function error(err) { console.warn(err); }

navigator.geolocation.getCurrentPosition(success, error, options);

// MOVE - nappi
document.getElementById('input_button').addEventListener('click', async () => {
  const query = document.getElementById('input_field').value;
  if (!query) return;

  // KÄYTTÄÄ NOMINATIM kordinaattien saamiseen
  const url = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}`;
  const response = await fetch(url);
  const results = await response.json();

  if (results.length === 0) {
    alert("Location not found!");
    return;
  }

  const { lat, lon } = results[0];
  const newLatLng = [parseFloat(lat), parseFloat(lon)];

  // siirtää PINNIN ja Kohdistaa karttaa keskelle
  marker.setLatLng(newLatLng);
  map.setView(newLatLng, 5);
  marker.bindPopup(query).openPopup();
});
</script>

</body>
</html>
