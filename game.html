<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Flight game</title>
  <link rel="stylesheet" href="css/game.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.7.1/leaflet.css">
</head>

<body>

  <header>
    <h1>FLIGHT GAME</h1>
  </header>

  <div class="sijainti">
      <p>WELCOME TO:</p>
      <p id="flag" class="flag"></p>
      <p id="country"> COUNTRY:</p>
      <p id="city"> CITY:</p>
      <span id="weather">WEATHER:</span>
      <button>PLAY AGAIN!</button>
  </div>

  <!-- KARTTA + PANEELIT OSIO EROTELTUNA -->
  <main>
    <section id="map" class="card"></section>

    <!-- PANEELIT 1 ja 2 -->
    <aside class="sidebar">
  <section id="panel_1" class="panel">
    <h2>GAME STATUS</h2>

    <div class="stat">
      <span class="label">PLAYER:</span>
      <span id="player_name" class="value"></span>
    </div>

    <div class="stat">
      <span class="label">CASH:</span>
      <span id="player_cash" class="value"></span>
    </div>

    <div class="stat">
      <span class="label">POINTS:</span>
      <span id="player_points" class="value"></span>
    </div>

    <div class="stat">
      <span class="label">LOCATION:</span>
      <span id="player_location" class="value"></span>
    </div>

    <div class="stat">
      <span class="label">ICAO:</span>
      <span id="player_location_icao" class="value"></span>
    </div>

    <div class="stat">
      <span class="label">TOTAL KM'S:</span>
      <span id="total_distance" class="value"></span>
    </div>

    <div class="stat">
      <span class="label">TOTAL CO2:</span>
      <span id="total_CO2" class="value"></span>
    </div>
  </section>

      <!-- PANEELI 2 - NAVIGAATTORI -->
<section id="panel_2" class="panel">
  <h2>NAVIGATION</h2>
  <div id="nav_wrapper">
    <div id="nav_arrow"></div>
    <p id="nav_text"></p>
  </div>
</section>
    </aside>

  </main>

    <section class="input_box">
    <input type="text" id="input_field" placeholder="TEMPORARELY DISABLED" />
    <button id="input_button">BUTTON</button>
  </section>

    <div id="player-modal">
    <form id="player-form">
      <input type="text" placeholder="Player name" required>
      <input type="submit" value="Start game">
    </form>
  </div>

  <footer>
  </footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.7.1/leaflet.js"></script>
<!-- <script src="JS/EU_maat.js"></script> -->
<script src="JS/navigator.js"></script>
<script src="JS/map.js"></script>
<script src="JS/player.js"></script>
<script src="JS/travel_to.js"></script>

</body>
</html>
