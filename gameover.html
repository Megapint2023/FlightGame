<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Flight game</title>
  <link rel="stylesheet" href="css/gameover.css">
</head>

<body>
  <header>
    <h1>LOST SUITCASE</h1>
  </header>

  <!--  EI OLENNAISTA KÄYTTÖÄ TÄLLÄ SIVULLA  -->
<div class="sijainti">
    <div class="sijainti-row">
        <span class="sijainti-label">TOP RESULTS:</span>

      <!--  REDIRECT TOIMII MUTTA UUSI PELI KUITENKIN VAATII -> RESTART FLASK  -->
    </div>
    <button id="newgame_btn">NEW GAME</button>
</div>
<script>
document.getElementById("newgame_btn").addEventListener("click", () => {
    window.location.href = "game.html";
});
</script>

  <!-- HIGHSCORES TAULU -->
  <main>
      <section id="highscores" class="card">
    <h1>HIGHSCORES:</h1>
    <table id="highscore_table">
      <thead>
        <tr>
          <th>ID:</th>
          <th>Player</th>
          <th>Points</th>
          <th>Total Distance (km)</th>
          <th>Total CO2 (t)</th>
        </tr>
      </thead>
      <tbody>
        <!-- HIGHSCORES ammutaan tähän JS:llä -->
      </tbody>
    </table>
  </section>

    <!-- PANEELIT 1 ja 2 -->
    <aside class="sidebar">
  <section id="panel_1" class="panel">
  </section>

<section id="panel_2" class="panel">
</section>
    </aside>

  </main>

  <footer>
  </footer>

<script src="JS/highscores_table.js"></script>

</body>
</html>
